name: Refresh 2026 Season

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_core_history.py'
      - 'scripts/analytics/**'
      - '.github/workflows/refresh-season.yml'
  schedule:
    - cron: "0 11 * * 2"
      timezone: "America/New_York"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-season
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Verify ESPN credentials
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: |
          if [ -z "$ESPN_S2" ] || [ -z "$ESPN_SWID" ]; then
            echo "::error::Missing ESPN_S2 or ESPN_SWID repository secret. Add both under Settings > Secrets and variables > Actions."
            exit 1
          fi
      - name: Download complete ESPN archive
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: python scripts/discover_espn_history.py --seasons 2024 2025 2026
      - name: Audit future ESPN projection coverage
        run: python scripts/inspect_future_projections.py --start-week 9 --end-week 18
      - name: Rebuild record book data
        run: python scripts/build_core_history.py
      - name: Validate generated analytics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('app/data/core_history.json').read_text())
          by_season = {s['season']: s for s in data['seasons']}
          for item in data['analytics']['all_play']:
              season = by_season[item['season']]
              assert len(item['teams']) == len(season['teams'])
              assert all(row['weeks'] == len(item['completed_weeks']) for row in item['teams'])
              assert all(row['all_play_wins'] + row['all_play_losses'] + row['all_play_ties'] == row['weeks'] * (len(item['teams']) - 1) for row in item['teams'])
              assert abs(sum(row['luck_differential'] for row in item['teams'])) < 0.01
              print(f"Season {item['season']}: {len(item['completed_weeks'])} validated weeks, {len(item['teams'])} teams")
          PY
      - name: Save updated data
        run: |
          git add app/data/core_history.json data/reports/forecast_projection_coverage.json
          if git diff --cached --quiet; then
            echo "ESPN data produced no website changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update 2026 results and projection coverage"
            git push
          fi
