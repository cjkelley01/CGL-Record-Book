name: Refresh 2026 Season

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_core_history.py'
      - 'scripts/analytics/**'
      - 'scripts/fetch_waiver_pool.py'
      - 'scripts/fetch_nfl_schedule.py'
      - 'scripts/audit_lineup_readiness.py'
      - '.github/workflows/refresh-season.yml'
  schedule:
    - cron: "0 11 * * 2"
      timezone: "America/New_York"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-season
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Verify ESPN credentials
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: |
          if [ -z "$ESPN_S2" ] || [ -z "$ESPN_SWID" ]; then
            echo "::error::Missing ESPN_S2 or ESPN_SWID repository secret. Add both under Settings > Secrets and variables > Actions."
            exit 1
          fi
      - name: Download complete ESPN archive
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: python scripts/discover_espn_history.py --seasons 2024 2025 2026
      - name: Fetch verified NFL weekly schedule
        run: python -m scripts.fetch_nfl_schedule --start-week 8 --end-week 18
      - name: Fetch projected ESPN waiver candidates
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: python -m scripts.fetch_waiver_pool --start-week 9 --end-week 18
      - name: Audit future ESPN projection coverage
        run: python scripts/inspect_future_projections.py --start-week 9 --end-week 18
      - name: Audit legal projected lineups
        run: python -m scripts.audit_lineup_readiness --start-week 9 --end-week 18
      - name: Rebuild record book data
        run: python scripts/build_core_history.py
      - name: Recalculate playoff and championship forecasts
        run: python -m scripts.analytics.weekly_forecast
      - name: Prevent incomplete projections from replacing published forecast
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          path = Path("app/data/playoff_forecast.json")
          current = json.loads(path.read_text())
          if current["models"]["roster_aware"]["status"] != "available" or current["models"]["blended"]["status"] != "available":
              print("Future roster projections unavailable in this runner; preserving published forecast rather than replacing it with unavailable models.")
              original = subprocess.run(["git", "show", "HEAD:app/data/playoff_forecast.json"], check=True, capture_output=True, text=True).stdout
              path.write_text(original)
              snapshot = Path("data/forecasts") / f"2026-{__import__('datetime').datetime.now(__import__('datetime').timezone.utc).date().isoformat()}-week-{current['completed_through_week']:02d}.json"
              if snapshot.exists():
                  snapshot.unlink()
          PY
      - name: Validate generated analytics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('app/data/core_history.json').read_text())
          by_season = {s['season']: s for s in data['seasons']}
          for item in data['analytics']['all_play']:
              season = by_season[item['season']]
              assert len(item['teams']) == len(season['teams'])
              assert all(row['weeks'] == len(item['completed_weeks']) for row in item['teams'])
              assert all(row['all_play_wins'] + row['all_play_losses'] + row['all_play_ties'] == row['weeks'] * (len(item['teams']) - 1) for row in item['teams'])
              assert abs(sum(row['luck_differential'] for row in item['teams'])) < 0.01
              print(f"Season {item['season']}: {len(item['completed_weeks'])} validated weeks, {len(item['teams'])} teams")
          PY
      - name: Save updated data
        run: |
          git add app/data/core_history.json app/data/playoff_forecast.json
          git add -f data/forecasts/2026-*.json
          git add -f data/reports/forecast_projection_coverage.json data/reports/lineup_projection_readiness.json
          if git diff --cached --quiet; then
            echo "ESPN data produced no website changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update 2026 results and projection coverage"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
