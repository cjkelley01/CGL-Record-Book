name: ESPN Team Score Reconciliation and Uncertainty (manual)

on:
  workflow_dispatch:
    inputs:
      seasons:
        description: 'Historical weeks to check'
        required: true
        default: '2024:18,2025:18,2026:7'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/fix-team-matchup-reconciliation
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install requests
      - name: Verify period handling regression tests
        run: python -m unittest discover -s tests -p test_team_score_period_selection.py
      - name: Extract historical player data
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          SEASONS: ${{ inputs.seasons }}
        run: python -m scripts.extract_historical_player_data --seasons "$SEASONS"
      - name: Reconcile against official ESPN weekly matchup totals
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: python -m scripts.audit_team_score_uncertainty
      - name: Upload research results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: espn-team-score-uncertainty
          path: |
            historical-player-dataset/
            team-uncertainty-research/
          retention-days: 14
