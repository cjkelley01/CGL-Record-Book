name: ESPN Full Historical Player Audit (manual)

on:
  workflow_dispatch:
    inputs:
      seasons:
        description: 'Completed season weeks (season:last_week)'
        required: true
        default: '2024:18,2025:18,2026:8'

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/espn-full-history-audit
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install requests
      - name: Collect historical player weeks and field inventory
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          SEASONS: ${{ inputs.seasons }}
        run: python -m scripts.extract_historical_player_data --seasons "$SEASONS"
      - name: Save research results even on partial failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: espn-full-historical-player-dataset
          path: historical-player-dataset/
          retention-days: 14
