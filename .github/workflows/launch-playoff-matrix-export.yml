name: Launch playoff matrix export (development branch)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout isolated development branch
        uses: actions/checkout@v4
        with:
          ref: research/week9-playoff-seed-matrix
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - name: Validate projection and fallback tests
        run: python -m unittest tests.test_reference_week_waiver_estimates tests.test_export_remaining_week_projections tests.test_espn_projections tests.test_optimal_lineup tests.test_week9_seed_matrix tests.test_freeze_week9_history tests.test_championship_scenarios -v
      - name: Download ESPN league snapshots
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: python scripts/discover_espn_history.py --seasons 2026 --end-week 14
      - name: Refresh future-week team rosters
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: python -m scripts.fetch_future_rosters --start-week 10 --end-week 14
      - name: Fetch verified NFL schedule
        run: python -m scripts.fetch_nfl_schedule --start-week 10 --end-week 14
      - name: Fetch waiver projections
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: python -m scripts.fetch_waiver_pool --start-week 10 --end-week 14
      - name: Export team-only projections and coverage
        run: python -m scripts.export_remaining_week_projections
      - name: Freeze Week-9 final scores from authenticated ESPN source
        run: python -m scripts.freeze_week9_history
      - name: Simulate both Week-9 seed matrices (200,000 trials each)
        run: python -m scripts.export_week9_seed_matrix --history data/reports/week9_history_snapshot.json --simulations 200000
      - name: Simulate championship odds and Week-18 sensitivity (six scenarios)
        run: python -m scripts.export_week9_championship_scenarios --simulations 200000
      - name: Upload team-only report
        uses: actions/upload-artifact@v4
        with:
          name: cgl-remaining-week-team-projections
          path: |
            data/reports/remaining_week_team_projections.json
            data/reports/week9_history_snapshot.json
            data/reports/week9_seed_matrix.json
            data/reports/week9_seed_matrix.csv
            data/reports/week9_championship_scenarios.json
            data/reports/week9_championship_scenarios.csv
          retention-days: 14
