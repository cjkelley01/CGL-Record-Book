name: ESPN Historical Projection Audit (manual)

on:
  workflow_dispatch:
    inputs:
      weeks:
        description: 'Comma-separated season:week pairs'
        required: true
        default: '2024:6,2025:6,2026:6'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/espn-historical-projection-audit
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install requests
      - name: Audit historical roster projections and actuals
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          WEEKS: ${{ inputs.weeks }}
        run: python -m scripts.audit_historical_projections --weeks "$WEEKS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: espn-historical-projection-audit
          path: historical-projection-audit/
          retention-days: 14
