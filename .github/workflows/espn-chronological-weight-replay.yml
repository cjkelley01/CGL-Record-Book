name: ESPN Chronological Weight Replay (manual)

on:
  workflow_dispatch:
    inputs:
      seasons:
        description: 'Completed historical weeks'
        required: true
        default: '2024:18,2025:18,2026:7'

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/chronological-weight-replay
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install requests
      - name: Unit tests
        run: python -m unittest tests.test_replay_historical_weights -v
      - name: Historical ESPN extraction
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          SEASONS: ${{ inputs.seasons }}
        run: python -m scripts.extract_historical_player_data --seasons "$SEASONS"
      - name: Reconcile team scores
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: python -m scripts.audit_team_score_uncertainty
      - name: Matchup reconstruction
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: python -m scripts.backtest_matchup_probabilities
      - name: Walk-forward weight replay
        run: python -m scripts.replay_historical_weights
      - name: Upload research
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: espn-chronological-weight-replay
          path: |
            chronological-weight-research/
            matchup-probability-research/
            team-uncertainty-research/
          retention-days: 14
