name: ESPN Point-in-Time and Blend Research (manual)

on:
  workflow_dispatch:
    inputs:
      seasons:
        description: 'Completed historical weeks'
        required: true
        default: '2024:18,2025:18,2026:7'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/point-in-time-forecast-audit
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install requests
      - name: Extract historical player data
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          SEASONS: ${{ inputs.seasons }}
        run: python -m scripts.extract_historical_player_data --seasons "$SEASONS"
      - name: Reconcile official scores
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: python -m scripts.audit_team_score_uncertainty
      - name: Reconstruct historical matchups
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: python -m scripts.backtest_matchup_probabilities
      - name: Audit provenance and chronological blend
        run: python -m scripts.audit_point_in_time_blend
      - name: Upload research
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: espn-point-in-time-blend-research
          path: |
            point-in-time-research/
            matchup-probability-research/
            team-uncertainty-research/
          retention-days: 14
