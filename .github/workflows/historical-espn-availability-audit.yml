name: Historical ESPN Availability Audit (manual)

on:
  workflow_dispatch:
    inputs:
      pairs:
        description: 'season:cutoff:target triples separated by commas'
        required: true
        default: '2024:7:10,2024:10:13,2025:7:10,2025:10:13'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install requests
      - name: Audit historical API availability
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          PAIRS: ${{ inputs.pairs }}
        run: python -m scripts.audit_historical_availability --pairs "$PAIRS"
      - name: Upload sanitized audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-espn-availability-audit
          path: historical-availability-audit/report.json
          retention-days: 14
